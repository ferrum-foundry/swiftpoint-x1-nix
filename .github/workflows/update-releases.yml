name: Update Swiftpoint releases

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-swiftpoint-releases
  cancel-in-progress: false

jobs:
  update:
    name: Check for Swiftpoint releases
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update release metadata
        run: ./update.sh

      - name: Stage release metadata
        run: git add -- packages/default.nix packages/releases

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --staged --quiet -- packages/default.nix packages/releases; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate flake
        if: steps.changes.outputs.changed == 'true'
        run: nix flake check

      - name: Build stable and beta packages
        if: steps.changes.outputs.changed == 'true'
        run: nix build .#stable .#beta --no-link

      - name: Open release update pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automated/update-swiftpoint-releases
          delete-branch: true
          commit-message: "chore: update Swiftpoint X1 releases"
          title: "chore: update Swiftpoint X1 releases"
          body: |
            Automated release update generated by `./update.sh`.

            Both stable and beta packages were evaluated and built before this
            pull request was opened. Review the upstream URLs, hashes, and
            package changes before merging.
          add-paths: |
            packages/default.nix
            packages/releases
